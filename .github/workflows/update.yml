name: Actualizar agenda deportiva

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4 horas (en punto, hora UTC). Ajustalo si queres otra frecuencia.
  workflow_dispatch: {}

concurrency:
  group: agenda-deportiva-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar eventos en Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
        run: python update_events.py

      - name: Generar dashboard HTML
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python generate_dashboard.py

      - name: Publicar dashboard actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --quiet --cached; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Actualizar dashboard [skip ci]"
            git pull --rebase origin main
            git push
          fi
