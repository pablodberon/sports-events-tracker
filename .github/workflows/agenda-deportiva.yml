name: Agenda deportiva (v2)

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4 horas (en punto, hora UTC). Ajustalo si queres otra frecuencia.
  workflow_dispatch: {}

concurrency:
  group: agenda-deportiva-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar version de los scripts
        run: |
          echo "Lineas en update_events.py:"
          wc -l update_events.py
          echo "Lineas en generate_dashboard.py:"
          wc -l generate_dashboard.py
          echo "(update_events.py deberia tener 605 lineas, generate_dashboard.py deberia tener jornada_date)"
          grep -c "jornada_date" generate_dashboard.py || echo "jornada_date NO ENCONTRADO - archivo viejo (falta el agrupado por jornada)"
          grep -c "updates_by_record_id" update_events.py || echo "updates_by_record_id NO ENCONTRADO - archivo viejo"

      - name: Actualizar eventos en Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
        run: python update_events.py

      - name: Generar dashboard HTML
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python generate_dashboard.py

      - name: Publicar dashboard actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/index.html y docs/.nojekyll son generados, nunca editados a mano,
          # asi que no tiene sentido "mezclarlos" con lo que haya en remoto si
          # cambio mientras corria este job: nos paramos sobre el ultimo commit
          # remoto y reconstruimos el archivo arriba, evitando cualquier
          # conflicto de merge.
          git fetch origin main
          git reset --mixed origin/main
          git add docs/index.html docs/.nojekyll
          if git diff --quiet --cached; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Actualizar dashboard [skip ci]"
            git push origin HEAD:main
          fi
